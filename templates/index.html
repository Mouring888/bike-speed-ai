<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚴 Bike Speed AI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: #1e293b;
    border-bottom: 1px solid #334155; height: 52px;
  }
  header h1 { font-size: 1.1rem; flex: 1; letter-spacing: 0.5px; }

  .btn {
    padding: 7px 14px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.85rem; font-weight: 600;
    transition: opacity 0.15s;
  }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-success { background: #22c55e; color: white; }
  .btn-warning { background: #f59e0b; color: #1a1a1a; }
  .btn-danger  { background: #ef4444; color: white; }
  .btn:hover   { opacity: 0.85; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Main Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    height: calc(100vh - 52px);
  }

  /* ── Video Panel ── */
  .video-panel { position: relative; background: #000; overflow: hidden; }

  #videoImg {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }

  /* Canvas overlay ทับบนวิดีโอ — ใช้รับ click */
  #overlayCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    cursor: crosshair;
  }

  /* คำแนะนำ calibration ลอยบนภาพ */
  #calibHint {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(0,0,0,0.75); color: #fbbf24;
    padding: 8px 14px; border-radius: 8px;
    font-size: 0.82rem; display: none;
    border: 1px solid #f59e0b55;
  }

  /* ── Dashboard ── */
  .dashboard {
    background: #1e293b; padding: 14px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }

  .card {
    background: #0f172a; border-radius: 10px; padding: 14px;
    border: 1px solid #1e293b;
  }
  .card h3 {
    font-size: 0.72rem; color: #64748b; margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;
  }

  /* Speed big number */
  .speed-big {
    font-size: 3.5rem; font-weight: 800; text-align: center;
    color: #22c55e; line-height: 1; transition: color 0.3s;
  }
  .speed-big.fast  { color: #ef4444; }
  .speed-unit {
    text-align: center; font-size: 0.9rem;
    color: #64748b; margin-top: 4px;
  }
  .selected-label {
    text-align: center; font-size: 0.8rem; color: #64748b; margin-bottom: 8px;
  }
  .selected-label span { color: #60a5fa; font-weight: 700; }

  /* Stats row */
  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    text-align: center; margin-top: 4px;
  }
  .stat-num  { font-size: 1rem; font-weight: 700; color: #e2e8f0; }
  .stat-lbl  { font-size: 0.68rem; color: #64748b; margin-top: 2px; }

  /* Chart */
  .chart-wrap { position: relative; height: 160px; }

  /* Status bar */
  #statusBar {
    background: #0f172a; border: 1px solid #334155;
    padding: 7px 12px; border-radius: 8px;
    font-size: 0.78rem; color: #94a3b8; line-height: 1.4;
  }

  /* Calibration info */
  #calibInfo { font-size: 0.78rem; color: #64748b; line-height: 1.6; }
  #calibInfo.done { color: #86efac; }

  /* Pulse animation for live indicator */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .live-dot {
    display: inline-block; width: 8px; height: 8px;
    background: #22c55e; border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
    margin-right: 5px; vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <h1>🚴 Bike Speed AI</h1>
  <input type="file" id="fileInput" accept=".mp4" style="display:none">
  <button class="btn btn-primary"  onclick="document.getElementById('fileInput').click()">📁 Upload</button>
  <button class="btn btn-warning"  id="btnCalib" disabled>🎯 Calibrate</button>
  <button class="btn btn-success"  id="btnRun"   disabled>▶ Run</button>
  <button class="btn btn-danger"   id="btnStop"  disabled>⏹ Stop</button>
</header>

<div class="layout">

  <!-- ── Video Panel ── -->
  <div class="video-panel">
    <img id="videoImg" src="" alt="">
    <canvas id="overlayCanvas"></canvas>
    <div id="calibHint">🎯 คลิกจุดที่ 1...</div>
  </div>

  <!-- ── Dashboard ── -->
  <div class="dashboard">

    <div id="statusBar">⏳ รอการอัพโหลดวิดีโอ (.mp4)</div>

    <!-- Speed Card -->
    <div class="card">
      <h3>🚴 Selected Bike</h3>
      <div class="selected-label">Track ID: <span id="selectedId">—</span></div>
      <div class="speed-big" id="speedDisplay">—</div>
      <div class="speed-unit">km / h</div>
    </div>

    <!-- Stats Card -->
    <div class="card">
      <h3>📊 Session Stats</h3>
      <div class="stats-row">
        <div>
          <div class="stat-num" id="statMax">—</div>
          <div class="stat-lbl">Max km/h</div>
        </div>
        <div>
          <div class="stat-num" id="statAvg">—</div>
          <div class="stat-lbl">Avg km/h</div>
        </div>
        <div>
          <div class="stat-num" id="statMin">—</div>
          <div class="stat-lbl">Min km/h</div>
        </div>
      </div>
    </div>

    <!-- Chart Card -->
    <div class="card">
      <h3>📈 Speed over Time</h3>
      <div class="chart-wrap">
        <canvas id="speedChart"></canvas>
      </div>
    </div>

    <!-- Calibration Card -->
    <div class="card">
      <h3>⚙️ Calibration</h3>
      <div id="calibInfo">ยังไม่ได้ Calibrate<br>กด 🎯 Calibrate แล้วคลิก 2 จุดบนภาพ</div>
    </div>

  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
